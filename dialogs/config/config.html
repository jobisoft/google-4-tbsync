<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title data-i18n-content="config.title"></title>
    <link rel="stylesheet" href="../shared/dropdown.css" />
    <script type="module" src="config.mjs"></script>
    <style>
      :root {
        --bg-page: #fff;
        --bg-card: #fff;
        --bg-card-hover: #f6f9fd;
        --bg-card-active: #e6efff;
        --bg-input-disabled: #f4f4f6;
        --bg-display: #f8f8f9;
        --border-card: #d0d4d9;
        --border-card-active: #2a7fd4;
        --text-primary: #222;
        --text-secondary: #555;
        --text-tertiary: #666;
        --text-body: #333;
        --border-input: #ccc;
        --border-subtle: #ececee;
        --accent: #2a7fd4;
        --accent-hover: #1a6fc4;
        --accent-soft: #eaf3fc;
        --btn-secondary-bg: #e5e5e7;
        --warning-bg: #fff6d9;
        --warning-accent: #e8b923;
        --warning-text: #5a4200;
        --error-bg: #ffe0e0;
        --error-accent: #c43b3b;
        --error-text: #7a2222;
        --info-bg: #d7f5dd;
        --info-accent: #1b6e33;
        --info-text: #0e4a20;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-page: #1e1f21;
          --bg-card: #2b2d30;
          --bg-card-hover: #34373d;
          --bg-card-active: #2a3e5a;
          --bg-input-disabled: #2a2c2f;
          --bg-display: #26282b;
          --border-card: #4a4d52;
          --border-card-active: #5fa6e8;
          --text-primary: #e8e9eb;
          --text-secondary: #b3b5ba;
          --text-tertiary: #9498a0;
          --text-body: #d6d8dc;
          --border-input: #4a4d52;
          --border-subtle: #3a3c40;
          --accent: #5fa6e8;
          --accent-hover: #7ab5ec;
          --accent-soft: #1f3144;
          --btn-secondary-bg: #3a3c40;
          --warning-bg: #3d3319;
          --warning-accent: #d9b74e;
          --warning-text: #e6c76c;
          --error-bg: #3f1f1f;
          --error-accent: #e66a6a;
          --error-text: #f3a5a5;
          --info-bg: #1f3d28;
          --info-accent: #6dbb7f;
          --info-text: #a0d7a8;
        }
      }

      body {
        font-family: system-ui, sans-serif;
        font-size: 13px;
        color: var(--text-primary);
        background: var(--bg-page);
        margin: 0;
        padding: 20px 24px;
      }
      h2 { margin: 0 0 10px; font-size: 15px; font-weight: 600; }

      .readonly-banner {
        display: none;
        background: var(--warning-bg);
        border-left: 3px solid var(--warning-accent);
        padding: 8px 12px;
        font-size: 12px;
        color: var(--warning-text);
        border-radius: 3px;
        margin-bottom: 16px;
      }
      .readonly-banner.visible { display: block; }

      .field { display: flex; flex-direction: column; margin-bottom: 10px; }
      .field label {
        font-size: 11px; color: var(--text-secondary); text-transform: uppercase;
        letter-spacing: .04em; margin-bottom: 4px;
      }
      .field input[type="text"] {
        padding: 5px 8px; border: 1px solid var(--border-input); border-radius: 4px; font-size: 13px;
        background: var(--bg-card); color: var(--text-primary);
      }
      .field input:disabled { background: var(--bg-input-disabled); color: var(--text-tertiary); }
      .field .display {
        padding: 5px 8px; border: 1px solid var(--border-subtle); background: var(--bg-display);
        border-radius: 4px; font-size: 13px; color: var(--text-body);
        font-family: ui-monospace, monospace;
        word-break: break-all;
      }
      .field .dropdown { margin-bottom: 0; }

      .checkbox-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
      .checkbox-row label { font-size: 13px; color: var(--text-body); text-transform: none; letter-spacing: 0; margin: 0; }

      .actions { display: flex; align-items: center; gap: 8px; margin-top: 20px; }
      .actions .right { display: flex; gap: 8px; margin-left: auto; }
      button.primary {
        padding: 6px 14px; background: var(--accent); color: #fff; border: none;
        border-radius: 4px; cursor: pointer; font-size: 13px;
      }
      button.primary:hover { background: var(--accent-hover); }
      button.primary:disabled { opacity: .5; cursor: not-allowed; }
      button.secondary {
        padding: 6px 14px; background: var(--btn-secondary-bg); color: var(--text-primary); border: none;
        border-radius: 4px; cursor: pointer; font-size: 13px;
      }
      button.ghost {
        background: var(--bg-card); color: var(--accent); border: 1px solid var(--accent);
        padding: 5px 14px; border-radius: 4px; cursor: pointer; font-size: 12px;
      }
      button.ghost:hover { background: var(--accent-soft); }
      button.ghost:disabled { opacity: .4; cursor: not-allowed; }
      button[hidden] { display: none; }

      .error {
        margin-top: 10px; padding: 8px 12px; background: var(--error-bg);
        border-left: 3px solid var(--error-accent); color: var(--error-text); font-size: 12px;
        border-radius: 3px; display: none;
      }
      .error.visible { display: block; }
      .info {
        margin-top: 10px; padding: 8px 12px; background: var(--info-bg);
        border-left: 3px solid var(--info-accent); color: var(--info-text); font-size: 12px;
        border-radius: 3px; display: none;
      }
      .info.visible { display: block; }
    </style>
  </head>
  <body>
    <h2 id="title" data-i18n-content="config.title"></h2>

    <div id="readonly-banner" class="readonly-banner"></div>

    <div class="field">
      <label data-i18n-content="config.label"></label>
      <input id="account-name" type="text" />
    </div>
    <div class="field">
      <label data-i18n-content="config.email"></label>
      <div id="email" class="display"></div>
    </div>
    <div class="field">
      <label data-i18n-content="config.clientType"></label>
      <div id="client-type"></div>
    </div>
    <div class="field">
      <label data-i18n-content="config.clientId"></label>
      <div id="client-id" class="display"></div>
    </div>
    <div class="checkbox-row">
      <input id="read-only-mode" type="checkbox" />
      <label for="read-only-mode" data-i18n-content="config.readOnlyMode"></label>
    </div>
    <div class="checkbox-row">
      <input id="include-system-groups" type="checkbox" />
      <label for="include-system-groups" data-i18n-content="config.includeSystemContactGroups"></label>
    </div>

    <div id="error" class="error"></div>
    <div id="info"  class="info"></div>

    <div class="actions">
      <div class="right">
        <button id="btn-save"   class="primary"   data-i18n-content="config.save"></button>
        <button id="btn-cancel" class="secondary"></button>
      </div>
    </div>
  </body>
</html>
