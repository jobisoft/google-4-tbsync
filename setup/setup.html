<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Add a Google account</title>
    <script type="module" src="setup.mjs"></script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        font-size: 13px;
        color: #222;
        margin: 0;
        padding: 20px 24px;
      }
      h2 { margin: 0 0 10px; font-size: 15px; font-weight: 600; }
      p.intro { color: #555; line-height: 1.5; margin: 0 0 16px; }
      .field { display: flex; flex-direction: column; margin-bottom: 10px; }
      .field label { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
      .field input { padding: 5px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
      .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
      button {
        padding: 6px 14px;
        background: #2a7fd4;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
      }
      button.secondary { background: #e5e5e7; color: #222; }
      button:disabled { opacity: .5; cursor: not-allowed; }
      .note {
        margin-top: 16px;
        padding: 8px 12px;
        background: #fff6d9;
        border-left: 3px solid #e8b923;
        font-size: 12px;
        color: #5a4200;
        border-radius: 3px;
      }
      .error {
        margin-top: 10px;
        padding: 8px 12px;
        background: #ffe0e0;
        border-left: 3px solid #c43b3b;
        color: #7a2222;
        font-size: 12px;
        border-radius: 3px;
        display: none;
      }
      .error.visible { display: block; }
    </style>
  </head>
  <body>
    <h2 data-i18n="setup.title"></h2>
    <p class="intro" data-i18n="setup.intro"></p>

    <div class="field">
      <label data-i18n="setup.accountName"></label>
      <input id="account-name" type="text" placeholder="john@gmail.com" />
    </div>
    <div class="field">
      <label data-i18n="setup.clientID"></label>
      <input id="client-id" type="text" autocomplete="off" />
    </div>
    <div class="field">
      <label data-i18n="setup.clientSecret"></label>
      <input id="client-secret" type="password" autocomplete="off" />
    </div>

    <div class="note">
      M1 build: OAuth is stubbed. The "Finish" button creates a local
      account record and registers it with TbSync. Real Google sign-in lands in M2.
    </div>

    <div id="error" class="error"></div>

    <div class="actions">
      <button id="btn-cancel" class="secondary" data-i18n="setup.cancelButton"></button>
      <button id="btn-finish" data-i18n="setup.finishButton"></button>
    </div>
  </body>
</html>
